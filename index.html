  updateDoc, deleteDoc, query, where, orderBy, onSnapshot, serverTimestamp, increment, limit }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyA4T2wA4-XWrGWQCoXd1v_4qM6KeR_D5Wg",
  authDomain:        "bairron-713ce.firebaseapp.com",
  projectId:         "bairron-713ce",
  storageBucket:     "bairron-713ce.firebasestorage.app",
  messagingSenderId: "1005754836387",
  appId:             "1:1005754836387:web:268022ff7a65179454e616"
};
const ADMIN_EMAILS = ["gustavo.filipe1707@gmail.com"];
// ─────────────────────────────────────────────

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const provider = new GoogleAuthProvider();

// ── ESTADO ────────────────────────────────────
let currentUser   = null;
let myLoja        = null;
let isAdmin       = false;
let unsubPortal   = null;

// ── AUTH ──────────────────────────────────────
window.doLogin  = () => signInWithPopup(auth, provider).catch(e => toast(e.message,'err'));
window.doLogout = async () => { await signOut(auth); go('home'); };

onAuthStateChanged(auth, async u => {
  currentUser = u;
  isAdmin     = u ? ADMIN_EMAILS.includes(u.email) : false;
  myLoja      = null;
  if (u) {
    const s = await getDocs(query(collection(db,'lojas'), where('uid','==',u.uid)));
    if (!s.empty) myLoja = { id: s.docs[0].id, ...s.docs[0].data() };
  }
  render();
});

// ── ROUTER ────────────────────────────────────
const go = r => { location.hash = r; };
const route = () => location.hash.slice(1) || 'home';
window.addEventListener('hashchange', render);

function render() {
  const r = route();
  if (r.startsWith('vitrine')) { renderVitrinePage(r.split('/')[1]||''); return; }
  const pages = {
    home:      pgHome,
    explorar:  pgExplorar,
    painel:    pgPainel,
    cadastro:  pgCadastro,
    admin:     pgAdmin,
  };
  const fn = pages[r] || pgHome;
  document.getElementById('root').innerHTML = shell(fn());
  hydrate(r);
}

// ── SHELL (nav + conteúdo) ────────────────────
function shell(content) {
  return `
  <nav class="nav">
    <a href="#home" class="logo">bairro<span>on</span></a>
    <div class="nav-links">
      <a href="#home"     class="nl ${route()==='home'?'act':''}">Início</a>
      <a href="#explorar" class="nl ${route()==='explorar'?'act':''}">Explorar</a>
      ${currentUser ? `<a href="#painel" class="nl ${route()==='painel'?'act':''}">Minha loja</a>` : ''}
      ${isAdmin     ? `<a href="#admin"  class="nl ${route()==='admin'?'act':''}">Admin</a>` : ''}
    </div>
    <div class="nav-right">
      ${currentUser
        ? `<img src="${currentUser.photoURL||''}" class="nav-avatar" onerror="this.style.display='none'">
           <span class="nav-name">${currentUser.displayName.split(' ')[0]}</span>
           <button class="btn-out" onclick="doLogout()">Sair</button>`
        : `<button class="btn-login" onclick="doLogin()">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
             Entrar com Google
           </button>`
      }
    </div>
  </nav>
  <div class="page">${content}</div>
  <div id="toasts"></div>`;
}

  return `

window.filtrarCat = cat => { go('explorar'); setTimeout(() => { setExploreCat(cat); }, 200); };

function skeletonCard() {
  return `<div class="skel-card"><div class="skel-img"></div><div class="skel-line w70"></div><div class="skel-line w50"></div></div>`;
}
function skeletonStore() {
  return `<div class="skel-store"><div class="skel-avatar"></div><div style="flex:1"><div class="skel-line w70"></div><div class="skel-line w40"></div></div></div>`;
}

async function loadHome() {
  const q1 = query(collection(db,'lojas'), where('ativo','==',true), where('aprovado','==',true));
  onSnapshot(q1, snap => {
    const lojas = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    // promos
    const comPromo = lojas.filter(l => l.promo && l.plano !== 'basico').slice(0,6);
    const feedEl = document.getElementById('feed-promos');
    if (feedEl) feedEl.innerHTML = comPromo.length
      ? comPromo.map(l => promoCard(l)).join('')
      : '<p style="color:#999;grid-column:1/-1;text-align:center;padding:20px">Nenhuma promoção ativa no momento.</p>';

    // lojas destaque
    const sorted = [...lojas].sort((a,b) => (b.rating||0)-(a.rating||0)).slice(0,6);
    const lojasEl = document.getElementById('home-lojas');
    if (lojasEl) {
      lojasEl.innerHTML = sorted.map(l => storeRow(l)).join('');
      lojasEl.querySelectorAll('.store-row').forEach(el =>
        el.addEventListener('click', () => openLoja(el.dataset.id)));
    }
  });
}

// ══════════════════════════════════════════════
let exploreCat = '';
function setExploreCat(cat) {
  exploreCat = cat;
  document.querySelectorAll('.exp-cat').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  filterExplorar();
}
window.setExploreCat = setExploreCat;

function pgExplorar() {
  return `
  <div class="exp-wrap">
    <div class="exp-top">
      <div class="exp-search-wrap">
        <span class="search-icon">🔍</span>
        <input class="exp-search" id="expSearch" placeholder="Buscar loja ou serviço..." oninput="filterExplorar()">
      </div>
      <select class="exp-sel" id="expBairro" onchange="filterExplorar()">
        <option value="">Todos os bairros</option>
      </select>
      <select class="exp-sel" id="expStars" onchange="filterExplorar()">
        <option value="">Qualquer nota</option>
        <option value="4">4+ ⭐</option>
        <option value="3">3+ ⭐</option>
      </select>
      <label class="exp-check">
        <input type="checkbox" id="expPromo" onchange="filterExplorar()"> Só promoções
      </label>
    </div>

    <div class="cat-pills-row" id="expCatRow">
      <button class="exp-cat active" data-cat="" onclick="setExploreCat('')">Todos</button>
      ${[
        {v:'alimentacao',l:'🍕 Alimentação'},
        {v:'servicos',   l:'🔧 Serviços'},
        {v:'varejo',     l:'🛍️ Varejo'},
        {v:'saude',      l:'💊 Saúde'},
        {v:'beleza',     l:'💇 Beleza'},
        {v:'educacao',   l:'📚 Educação'},
      ].map(c => `<button class="exp-cat" data-cat="${c.v}" onclick="setExploreCat('${c.v}')">${c.l}</button>`).join('')}
    </div>

    <div id="exp-count" class="exp-count"></div>

    <div class="exp-layout">
      <div class="exp-grid" id="exp-grid">
        ${[1,2,3,4,5,6,7,8].map(() => skeletonCard()).join('')}
      </div>
    </div>
  </div>`;
}

let allLojasExp = [];

async function loadExplorar() {
  if (unsubPortal) unsubPortal();
  const q = query(collection(db,'lojas'), where('ativo','==',true), where('aprovado','==',true));
  unsubPortal = onSnapshot(q, snap => {
    allLojasExp = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    populateBairros('expBairro', allLojasExp);
    filterExplorar();
  });
}

window.filterExplorar = function() {
  const q     = (document.getElementById('expSearch')?.value||'').toLowerCase();
  const bairro= document.getElementById('expBairro')?.value||'';
  const stars = parseFloat(document.getElementById('expStars')?.value)||0;
  const promo = document.getElementById('expPromo')?.checked;

  const filtered = allLojasExp.filter(l => {
    if (exploreCat && l.categoria !== exploreCat) return false;
    if (bairro && l.bairro !== bairro) return false;
    if (stars && (l.rating||0) < stars) return false;
    if (promo && !l.promo) return false;
    if (q && !`${l.nome}${l.bairro}${l.descricao||''}`.toLowerCase().includes(q)) return false;
    return true;
  });

  const cnt = document.getElementById('exp-count');
  if (cnt) cnt.textContent = `${filtered.length} estabelecimento${filtered.length!==1?'s':''} encontrado${filtered.length!==1?'s':''}`;

  const grid = document.getElementById('exp-grid');
  if (!grid) return;
  grid.innerHTML = filtered.length
    ? filtered.map(l => bigCard(l)).join('')
    : `<div class="empty-exp">😅 Nenhuma loja encontrada.<br><small>Tente outros filtros.</small></div>`;

  grid.querySelectorAll('.big-card').forEach(c =>
    c.addEventListener('click', () => openLoja(c.dataset.id)));
};

function populateBairros(elId, lojas) {
  const sel = document.getElementById(elId);
  if (!sel) return;
  const bairros = [...new Set(lojas.map(l=>l.bairro).filter(Boolean))].sort();
  const v = sel.value;
  sel.innerHTML = `<option value="">Todos os bairros</option>` +
    bairros.map(b => `<option ${b===v?'selected':''} value="${b}">${b}</option>`).join('');
}

// ── CARDS ────────────────────────────────────
const CAT_COLORS = {
  alimentacao:'#FFF3E0', servicos:'#E3F2FD', varejo:'#F3E5F5',
  saude:'#E8F5E9', beleza:'#FCE4EC', educacao:'#E8EAF6'
};
const CAT_EMOJIS = {
  alimentacao:'🍕', servicos:'🔧', varejo:'🛍️', saude:'💊', beleza:'💇', educacao:'📚'
};

function bigCard(l) {
  const cor = CAT_COLORS[l.categoria] || '#F5F5F5';
  const emoji = CAT_EMOJIS[l.categoria] || '🏪';
  const stars = starStr(l.rating||0);
  return `
  <div class="big-card ${l.plano==='premium'?'featured':''}" data-id="${l.id}">
    <div class="bc-cover" style="background:${cor}">
      ${l.coverUrl ? `<img src="${l.coverUrl}" class="bc-cover-img">` : `<span class="bc-emoji">${emoji}</span>`}
      ${l.promo ? `<div class="bc-promo-badge">🔥 Promoção</div>` : ''}
      ${l.plano==='premium' ? `<div class="bc-dest-badge">⭐ Destaque</div>` : ''}
    </div>
    <div class="bc-body">
      <div class="bc-cat-pill" style="background:${cor}">${catL(l.categoria)}</div>
      <div class="bc-name">${l.nome}</div>
      <div class="bc-addr">📍 ${l.bairro}${l.endereco?' · '+l.endereco:''}</div>
      <div class="bc-stars">${stars} <span class="bc-rating">${(l.rating||0).toFixed(1)} (${l.totalAvaliacoes||0})</span></div>
      ${l.promo ? `<div class="bc-promo-text">🏷️ ${l.promo}</div>` : ''}
      <div class="bc-foot">
        <span class="bc-status ${l.aberto?'open':'closed'}">${l.aberto?'✅ Aberto':'🔴 Fechado'}</span>
        ${l.telefone ? `<span class="bc-tel">📞 ${l.telefone}</span>` : ''}
      </div>
    </div>
  </div>`;
}

function promoCard(l) {
  const cor = CAT_COLORS[l.categoria] || '#F5F5F5';
  const emoji = CAT_EMOJIS[l.categoria] || '🏪';
  return `
  <div class="promo-card" data-id="${l.id}" onclick="openLoja('${l.id}')">
    <div class="pc-cover" style="background:${cor}">
      ${l.coverUrl ? `<img src="${l.coverUrl}" class="pc-cover-img">` : `<span style="font-size:40px">${emoji}</span>`}
    </div>
    <div class="pc-body">
      <div class="pc-nome">${l.nome}</div>
      <div class="pc-promo">🏷️ ${l.promo}</div>
      <div class="pc-bairro">📍 ${l.bairro}</div>
    </div>
  </div>`;
}

function storeRow(l) {
  const emoji = CAT_EMOJIS[l.categoria] || '🏪';
  const cor = CAT_COLORS[l.categoria] || '#F5F5F5';
  return `
  <div class="store-row" data-id="${l.id}">
    <div class="sr-avatar" style="background:${cor}">${l.coverUrl?`<img src="${l.coverUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:`<span style="font-size:22px">${emoji}</span>`}</div>
    <div class="sr-info">
      <div class="sr-name">${l.nome}</div>
      <div class="sr-sub">${catL(l.categoria)} · ${l.bairro}</div>
      <div class="sr-stars">${starStr(l.rating||0)} <span style="font-size:12px;color:#888">${(l.rating||0).toFixed(1)}</span></div>
    </div>
    ${l.promo ? `<span class="sr-promo-tag">🔥 Promo</span>` : ''}
  </div>`;
}

// ── MODAL LOJA ───────────────────────────────
window.openLoja = async function(id) {
  const snap = await getDoc(doc(db,'lojas',id));
  if (!snap.exists()) return;
  const l = { id, ...snap.data() };
  await updateDoc(doc(db,'lojas',id), { visualizacoes: increment(1) }).catch(()=>{});

  const avSnap = await getDocs(query(collection(db,'avaliacoes'),
    where('lojaId','==',id), orderBy('criadoEm','desc')));
  const avs = avSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const cor = CAT_COLORS[l.categoria]||'#F5F5F5';
  const emoji = CAT_EMOJIS[l.categoria]||'🏪';

  const m = document.createElement('div');
  m.className = 'modal-over';
  m.innerHTML = `
  <div class="modal-box">
    <button class="modal-close" onclick="this.closest('.modal-over').remove()">✕</button>
    <div class="modal-cover" style="background:${cor}">
      ${l.coverUrl ? `<img src="${l.coverUrl}" class="mc-img">` : `<span style="font-size:64px">${emoji}</span>`}
    </div>
    <div class="modal-body">
      <div class="modal-cat-pill" style="background:${cor}">${catL(l.categoria)}</div>
      <h2 class="modal-nome">${l.nome}</h2>
      ${l.descricao?`<p class="modal-desc">${l.descricao}</p>`:''}

      <div class="modal-chips">
        <span class="chip">📍 ${l.bairro}${l.endereco?' · '+l.endereco:''}</span>
        ${l.telefone?`<span class="chip">📞 ${l.telefone}</span>`:''}
        ${l.horario?`<span class="chip">🕐 ${l.horario}</span>`:''}
        <span class="chip ${l.aberto?'chip-green':'chip-gray'}">${l.aberto?'✅ Aberto agora':'🔴 Fechado'}</span>
      </div>

      <div class="modal-stars-row">
        <span style="font-size:20px">${starStr(l.rating||0)}</span>
        <span style="font-weight:700;font-size:18px">${(l.rating||0).toFixed(1)}</span>
        <span style="color:#888;font-size:14px">${l.totalAvaliacoes||0} avaliações</span>
      </div>

      ${l.promo?`<div class="modal-promo-box">🏷️ <strong>Promoção:</strong> ${l.promo}</div>`:''}

      <div class="modal-avs-title">O que dizem os clientes 💬</div>
      <div id="modal-avs-list">
        ${avs.length===0
          ? `<p style="color:#999;font-size:14px">Nenhuma avaliação ainda. Seja o primeiro!</p>`
          : avs.slice(0,5).map(a=>`
            <div class="av-card">
              <div class="av-top"><strong>${a.autor||'Anônimo'}</strong><span>${starStr(a.nota)}</span></div>
              <p>${a.texto||''}</p>
              ${a.resposta?`<div class="av-resp">💬 <em>Loja:</em> ${a.resposta}</div>`:''}
            </div>`).join('')}
      </div>

      ${currentUser?`
      <div class="av-form">
        <div class="av-form-title">Deixar avaliação ✍️</div>
        <div class="star-row" id="starRow" data-v="5">
          ${[1,2,3,4,5].map(n=>`<span class="star-btn active" data-n="${n}" onclick="pickStar(${n})">★</span>`).join('')}
        </div>
        <textarea id="avTxt" placeholder="Conta como foi a experiência..." rows="3"></textarea>
        <button class="btn-green" style="width:100%" onclick="submitAv('${id}')">Publicar avaliação</button>
      </div>`:`
      <div style="text-align:center;padding:16px;background:#f9f9f9;border-radius:12px;margin-top:16px">
        <p style="color:#666;margin-bottom:10px">Entre para deixar sua avaliação 😊</p>
        <button class="btn-green" onclick="doLogin()">Entrar com Google</button>
      </div>`}
    </div>
  </div>`;
  m.addEventListener('click', e => { if(e.target===m) m.remove(); });
  document.body.appendChild(m);
};

window.pickStar = n => {
  const row = document.getElementById('starRow');
  if(!row) return;
  row.dataset.v = n;
  row.querySelectorAll('.star-btn').forEach(s=>s.classList.toggle('active',+s.dataset.n<=n));
};

window.submitAv = async id => {
  if(!currentUser) return;
  const nota  = +document.getElementById('starRow')?.dataset.v||5;
  const texto = document.getElementById('avTxt')?.value.trim()||'';
  const ja = await getDocs(query(collection(db,'avaliacoes'),
    where('lojaId','==',id), where('uid','==',currentUser.uid)));
  if(!ja.empty){ toast('Você já avaliou esta loja 😊','err'); return; }
  await addDoc(collection(db,'avaliacoes'),{
    lojaId:id, uid:currentUser.uid, autor:currentUser.displayName, nota, texto, criadoEm:serverTimestamp()
  });
  const all = await getDocs(query(collection(db,'avaliacoes'),where('lojaId','==',id)));
  const notas = all.docs.map(d=>d.data().nota);
  await updateDoc(doc(db,'lojas',id),{
    rating: parseFloat((notas.reduce((a,b)=>a+b,0)/notas.length).toFixed(1)),
    totalAvaliacoes: notas.length
  });
  toast('Avaliação publicada! 🎉','ok');
  document.querySelector('.modal-over')?.remove();
};

function pgCadastro() {

window.selP = p => {
  document.querySelectorAll('.plano-opt').forEach(o => o.classList.toggle('active', o.dataset.p===p));
  document.getElementById('planoSel').value = p;
};

window.doCadastro = async () => {
  const nome   = document.getElementById('cNome')?.value.trim();
  const cat    = document.getElementById('cCat')?.value;
  const bairro = document.getElementById('cBairro')?.value.trim();
  if (!nome||!cat||!bairro) { toast('Preencha nome, categoria e bairro 👆','err'); return; }

  const btn = document.getElementById('btnCad');
  if (btn) { btn.textContent='Cadastrando...'; btn.disabled=true; }

  try {
    const data = {
      uid: currentUser.uid,
      nome, categoria:cat, bairro,
      endereco: document.getElementById('cEnd')?.value.trim()||'',
      telefone: document.getElementById('cTel')?.value.trim()||'',
      horario:  document.getElementById('cHor')?.value.trim()||'',
      site:     document.getElementById('cSite')?.value.trim()||'',
      descricao:document.getElementById('cDesc')?.value.trim()||'',
      coverUrl: document.getElementById('cCover')?.value.trim()||'',
      promo:    document.getElementById('cPromo')?.value.trim()||'',
      plano:    document.getElementById('planoSel')?.value||'basico',
      aberto:true, rating:0, totalAvaliacoes:0, visualizacoes:0,
      ativo:true, aprovado:false, criadoEm:serverTimestamp()
    };
    const ref = await addDoc(collection(db,'lojas'), data);
    myLoja = { id:ref.id, ...data };
    toast('Loja cadastrada! Aguardando aprovação 🎉','ok');
    setTimeout(()=>go('painel'),1500);
  } catch(e) {
    toast('Erro: '+e.message,'err');
    if(btn){btn.textContent='Cadastrar minha loja 🚀';btn.disabled=false;}
  }
};

window.setPT = (el,t) => {
  document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.pt-c').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('pt-'+t)?.classList.add('active');
  if(t==='avs') loadPainelAvs();
};

async function loadPainelAvs() {
  if(!myLoja) return;
  const snap = await getDocs(query(collection(db,'avaliacoes'),
    where('lojaId','==',myLoja.id), orderBy('criadoEm','desc')));
  const avs = snap.docs.map(d=>({id:d.id,...d.data()}));
  const el = document.getElementById('avs-list');
  if(!el) return;
  if(avs.length===0){el.innerHTML='<p style="color:#888">Nenhuma avaliação ainda.</p>';return;}
  el.innerHTML = avs.map(a=>`
    <div class="av-card">
      <div class="av-top"><strong>${a.autor||'Anônimo'}</strong><span>${starStr(a.nota)} ${a.nota}</span></div>
      <p>${a.texto||''}</p>
      ${a.resposta?`<div class="av-resp">💬 <em>Você respondeu:</em> ${a.resposta}</div>`:`
      <div class="av-reply-row">
        <input id="rp-${a.id}" placeholder="Responder publicamente...">
        <button class="btn-green" style="white-space:nowrap;padding:8px 14px;font-size:13px" onclick="replyAv('${a.id}')">Responder</button>
      </div>`}
    </div>`).join('');
}

window.replyAv = async id => {
  const txt = document.getElementById('rp-'+id)?.value.trim();
  if(!txt) return;
  await updateDoc(doc(db,'avaliacoes',id),{resposta:txt});
  toast('Resposta publicada! 💬','ok');
  loadPainelAvs();
};

window.savePromo = async () => {
  if(!myLoja) return;
  const promo = document.getElementById('promoTxt')?.value.trim()||'';
  await updateDoc(doc(db,'lojas',myLoja.id),{promo});
  myLoja.promo=promo;
  toast('Promoção salva! 🏷️','ok');
};
window.removePromo = async () => {
  if(!myLoja) return;
  await updateDoc(doc(db,'lojas',myLoja.id),{promo:''});
  myLoja.promo='';
  if(document.getElementById('promoTxt')) document.getElementById('promoTxt').value='';
  toast('Promoção removida.','ok');
};
window.savePerfil = async () => {
  if(!myLoja) return;
  const upd = {
    nome:     document.getElementById('pNome')?.value.trim()||myLoja.nome,
    categoria:document.getElementById('pCat')?.value||myLoja.categoria,
    bairro:   document.getElementById('pBairro')?.value.trim()||myLoja.bairro,
    endereco: document.getElementById('pEnd')?.value.trim()||'',
    telefone: document.getElementById('pTel')?.value.trim()||'',
    horario:  document.getElementById('pHor')?.value.trim()||'',
    descricao:document.getElementById('pDesc')?.value.trim()||'',
    coverUrl: document.getElementById('pCover')?.value.trim()||'',
  };
  await updateDoc(doc(db,'lojas',myLoja.id),upd);
  Object.assign(myLoja,upd);
  toast('Perfil salvo! ✅','ok');
};
window.toggleAberto = async () => {
  if(!myLoja) return;
  const novo = !myLoja.aberto;
  await updateDoc(doc(db,'lojas',myLoja.id),{aberto:novo});
  myLoja.aberto=novo;
  const btn = document.getElementById('togBtn');
  if(btn){ btn.textContent=novo?'✅ Aberto agora':'🔴 Fechado — toque para abrir'; btn.className=`toggle-btn ${novo?'tog-open':'tog-closed'}`; }
  toast(novo?'Loja aberta! ✅':'Loja fechada 🔴','ok');
};
window.copyLink = id => {
  navigator.clipboard.writeText(document.getElementById(id)?.textContent||'');
  toast('Link copiado! 📋','ok');
};

let adminLojas = [];

window.setAT = (el,tab) => {
  document.querySelectorAll('.a-tabs-row .ptab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.admin-wrap .pt-c').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(tab)?.classList.add('active');
  if(tab==='a-pendentes') loadPendentes();
  if(tab==='a-avs') loadAdminAvs();
  if(tab==='a-financeiro') loadFinanceiro();
};

async function loadAdmin() {
  const snap = await getDocs(query(collection(db,'lojas'), orderBy('criadoEm','desc')));
  adminLojas = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderAdminList(adminLojas);
}

window.filterAdmin = () => {
  const q  = (document.getElementById('aSearch')?.value||'').toLowerCase();
  const pl = document.getElementById('aFiltPlano')?.value||'';
  const at = document.getElementById('aFiltAtivo')?.value;
  const f  = adminLojas.filter(l=>{
    if(pl && l.plano!==pl) return false;
    if(at!==''&&at!==undefined && String(l.ativo)!==at) return false;
    if(q && !`${l.nome}${l.bairro}`.toLowerCase().includes(q)) return false;
    return true;
  });
  renderAdminList(f);
};

function renderAdminList(lojas) {
  const cnt = document.getElementById('a-count');
  if(cnt) cnt.textContent=`${lojas.length} loja${lojas.length!==1?'s':''}`;
  const el = document.getElementById('a-list');
  if(!el) return;
  el.innerHTML = lojas.map(l=>`
    <div class="admin-row">
      <div class="ar-avatar" style="background:${CAT_COLORS[l.categoria]||'#eee'}">
        ${l.coverUrl?`<img src="${l.coverUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:`<span>${CAT_EMOJIS[l.categoria]||'🏪'}</span>`}
      </div>
      <div class="ar-info">
        <strong>${l.nome}</strong>
        <span>📍 ${l.bairro} · ${catL(l.categoria)}</span>
        <div class="ar-chips">
          <span class="plano-chip plano-${l.plano}">${planoL(l.plano)}</span>
          <span class="chip ${l.ativo?'chip-green':'chip-gray'}">${l.ativo?'Ativa':'Inativa'}</span>
          <span class="chip ${l.aprovado?'chip-green':'chip-orange'}">${l.aprovado?'Aprovada':'Pendente'}</span>
          <span style="font-size:12px;color:#888">⭐ ${(l.rating||0).toFixed(1)} · 👁️ ${l.visualizacoes||0}</span>
        </div>
      </div>
      <div class="ar-actions">
        ${!l.aprovado?`<button class="btn-green" style="padding:6px 14px;font-size:13px" onclick="aprovarLoja('${l.id}')">✅ Aprovar</button>`:''}
        <button class="btn-outline" style="font-size:13px" onclick="toggleAtivoAdmin('${l.id}',${l.ativo})">${l.ativo?'Desativar':'Ativar'}</button>

window.aprovarLoja = async id => {
  await updateDoc(doc(db,'lojas',id),{aprovado:true});
  const l = adminLojas.find(x=>x.id===id);
  if(l) l.aprovado=true;
  filterAdmin(); loadPendentes();
  toast('Loja aprovada! ✅','ok');
};
window.rejeitarLoja = async id => {
  if(!confirm('Rejeitar e remover esta loja?')) return;
  await deleteDoc(doc(db,'lojas',id));
  adminLojas = adminLojas.filter(l=>l.id!==id);
  loadPendentes(); filterAdmin();
  toast('Loja rejeitada.','ok');
};
window.toggleAtivoAdmin = async (id,atual) => {
  await updateDoc(doc(db,'lojas',id),{ativo:!atual});
  const l=adminLojas.find(x=>x.id===id); if(l) l.ativo=!atual;
  filterAdmin(); toast('Status atualizado.','ok');
};
window.mudarPlanoAdmin = async (id,plano) => {
  await updateDoc(doc(db,'lojas',id),{plano});
  const l=adminLojas.find(x=>x.id===id); if(l) l.plano=plano;
  toast('Plano atualizado.','ok');
};
window.deletarLoja = async id => {
  if(!confirm('Remover loja permanentemente?')) return;
  await deleteDoc(doc(db,'lojas',id));
  adminLojas=adminLojas.filter(l=>l.id!==id);
  filterAdmin(); toast('Loja removida.','ok');
};
window.deletarAv = async (avId, lojaId) => {
  if(!confirm('Remover esta avaliação?')) return;
  await deleteDoc(doc(db,'avaliacoes',avId));
  const all = await getDocs(query(collection(db,'avaliacoes'),where('lojaId','==',lojaId)));
  const notas = all.docs.map(d=>d.data().nota);
  if(notas.length>0) {
    await updateDoc(doc(db,'lojas',lojaId),{rating:parseFloat((notas.reduce((a,b)=>a+b,0)/notas.length).toFixed(1)),totalAvaliacoes:notas.length});
  } else {
    await updateDoc(doc(db,'lojas',lojaId),{rating:0,totalAvaliacoes:0});
  }
  toast('Avaliação removida.','ok');
  loadAdminAvs();
};

//  VITRINE TV

function renderVitrinePage(bairro) {
  document.getElementById('root').innerHTML = `
  <div class="vt-wrap">
    <div class="vt-top">
      <div class="vt-logo">bairro<span>on</span></div>
      <div class="vt-bairro-name">${bairro?decodeURIComponent(bairro):'Promoções do bairro'}</div>
      <div class="vt-clock" id="vtClock">--:--</div>
    </div>
    <div class="vt-main" id="vtMain"><div class="vt-loading">Carregando promoções...</div></div>
    <div class="vt-prog-bar"><div class="vt-prog-fill" id="vtProg"></div></div>
    <div class="vt-dots" id="vtDots"></div>
    <div class="vt-bottom">
      <span>bairroon.com.br</span>
      <span>Anuncie seu comércio — R$ 39,90/mês</span>
      ${bairro?`<span>📍 ${decodeURIComponent(bairro)}</span>`:''}
    </div>
  </div>`;

  // clock
  const tickClock = () => {
    const el=document.getElementById('vtClock');
    if(el){const n=new Date();el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
  };
  tickClock(); setInterval(tickClock,10000);

  // lojas
  const bDec = bairro?decodeURIComponent(bairro):'';
  const q2 = bDec
    ? query(collection(db,'lojas'),where('ativo','==',true),where('aprovado','==',true),where('bairro','==',bDec))
    : query(collection(db,'lojas'),where('ativo','==',true),where('aprovado','==',true));

  const VT_COLS=['#1D9E75','#F59E0B','#EF4444','#8B5CF6','#3B82F6','#EC4899'];
  let vtCur=0,vtStart=null,vtRaf=null,vtTotal=0;

  onSnapshot(q2, snap => {
    const lojas = snap.docs.map(d=>({id:d.id,...d.data()})).filter(l=>l.promo&&l.plano!=='basico');
    const main  = document.getElementById('vtMain');
    const dots  = document.getElementById('vtDots');
    if(!main||!dots) return;

    if(lojas.length===0){main.innerHTML='<div class="vt-empty">Nenhuma promoção ativa no momento 😊</div>';return;}

    main.innerHTML = lojas.map((l,i)=>{
      const cor=VT_COLS[i%VT_COLS.length];
      return `<div class="vt-slide ${i===0?'on':''}" data-vi="${i}">
        <div class="vts-accent" style="background:${cor}"></div>
        <div class="vts-body">
          <div class="vts-cat" style="color:${cor}">${CAT_EMOJIS[l.categoria]||'🏪'} ${catL(l.categoria)} · ${l.bairro}</div>
          <div class="vts-nome">${l.nome}</div>
          <div class="vts-promo" style="color:${cor}">🏷️ ${l.promo}</div>
          <div class="vts-info">
            ${l.telefone?`<span>📞 ${l.telefone}</span>`:''}
            ${l.rating>0?`<span>⭐ ${l.rating.toFixed(1)} · ${l.totalAvaliacoes} avaliações</span>`:''}
            ${l.horario?`<span>🕐 ${l.horario}</span>`:''}
          </div>
        </div>
      </div>`;
    }).join('');

    vtTotal=lojas.length;
    dots.innerHTML=lojas.map((_,i)=>`<div class="vt-dot${i===0?' on':''}" onclick="vtGo(${i})"></div>`).join('');

    window.vtGo = idx => {
      document.querySelectorAll('.vt-slide').forEach(s=>s.classList.remove('on'));
      document.querySelectorAll('.vt-dot').forEach(d=>d.classList.remove('on'));
      vtCur=idx;
      document.querySelector(`.vt-slide[data-vi="${idx}"]`)?.classList.add('on');
      document.querySelectorAll('.vt-dot')[idx]?.classList.add('on');
      vtStart=performance.now();
    };
    if(vtRaf) cancelAnimationFrame(vtRaf);
    vtStart=performance.now();
    (function loop(ts){
      if(!vtStart) vtStart=ts;
      const pct=Math.min((ts-vtStart)/7000*100,100);
      const p=document.getElementById('vtProg');
      if(p) p.style.width=pct+'%';
      if(ts-vtStart>=7000) window.vtGo((vtCur+1)%vtTotal);
      vtRaf=requestAnimationFrame(loop);
    })(performance.now());
  });
}

// ── HELPERS ──────────────────────────────────
function starStr(r) {
  let s='';
  for(let i=1;i<=5;i++) s+=`<span style="color:${i<=Math.round(r)?'#F59E0B':'#D1D5DB'}">★</span>`;
  return s;
}
function catL(c) {
  return {alimentacao:'Alimentação',servicos:'Serviços',varejo:'Varejo',saude:'Saúde',beleza:'Beleza',educacao:'Educação'}[c]||c;
}
function planoL(p) {
  return {basico:'Grátis',vitrine:'Vitrine R$39,90',premium:'Premium R$159'}[p]||p;
}
function needLogin(acao) {
  return `<div class="page-msg">
    <span style="font-size:48px">👋</span>
    <h2>Entre para ${acao}</h2>
    <button class="btn-green" style="margin-top:16px" onclick="doLogin()">Entrar com Google</button>
  </div>`;
}
window.toast = function(msg,type='ok') {
  const c=document.getElementById('toasts');
  if(!c) return;
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000);
};

render();
